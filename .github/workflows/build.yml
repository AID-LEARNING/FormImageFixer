name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:

permissions:
  contents: write

jobs:
  build-gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build

      - name: Read project metadata
        id: project
        shell: bash
        run: |
          # Extraction du nom du projet et de la version via Gradle
          ARTIFACT_ID=$(./gradlew properties -q | grep "^name:" | awk '{print $2}')
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          
          # Nom par défaut généré par Gradle
          FINAL_NAME="${ARTIFACT_ID}-${VERSION}"
          
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "final_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_path=build/libs/$FINAL_NAME.jar" >> "$GITHUB_OUTPUT"

      - name: Verify artifact
        shell: bash
        run: |
          if [ ! -f "${{ steps.project.outputs.jar_path }}" ]; then
            echo "Le fichier ${{ steps.project.outputs.jar_path }} n'a pas été créé."
            echo "Contenu du dossier build/libs/ :"
            ls -la build/libs/ || echo "Le dossier build/libs/ n'existe pas."
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ steps.project.outputs.artifact_id }}
          path: ${{ steps.project.outputs.jar_path }}

      - name: Create GitHub release
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="${{ steps.project.outputs.tag }}"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${{ steps.project.outputs.jar_path }}" --clobber
          else
            gh release create "$RELEASE_TAG" "${{ steps.project.outputs.jar_path }}" --target "${{ github.sha }}" --title "$RELEASE_TAG" --notes "Automated release for $RELEASE_TAG"
          fi